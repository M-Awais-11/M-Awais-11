<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-label="Muhammad Awais Afzal — AI/ML Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1e2e"/>
      <stop offset="1" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5c2e7"/>
      <stop offset="0.5" stop-color="#cba6f7"/>
      <stop offset="1" stop-color="#89b4fa"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="0.5" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#f5c2e7"/>
      <stop offset="0.5" stop-color="#cba6f7"/>
      <stop offset="1" stop-color="#89b4fa"/>
      <animate attributeName="x1" values="0;-0.5;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.5;0;0.5" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="o1"><stop offset="0" stop-color="#cba6f7" stop-opacity="0.45"/><stop offset="1" stop-color="#cba6f7" stop-opacity="0"/></radialGradient>
    <radialGradient id="o2"><stop offset="0" stop-color="#89b4fa" stop-opacity="0.40"/><stop offset="1" stop-color="#89b4fa" stop-opacity="0"/></radialGradient>
    <radialGradient id="o3"><stop offset="0" stop-color="#f5c2e7" stop-opacity="0.30"/><stop offset="1" stop-color="#f5c2e7" stop-opacity="0"/></radialGradient>
    <clipPath id="card"><rect x="6" y="6" width="888" height="258" rx="26"/></clipPath>
  </defs>

  <rect x="6" y="6" width="888" height="258" rx="26" fill="url(#bg)"/>

  <g clip-path="url(#card)">
    <circle cx="120" cy="70" r="170" fill="url(#o1)">
      <animate attributeName="cx" values="120;200;120" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="220" r="180" fill="url(#o2)">
      <animate attributeName="cy" values="220;170;220" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="470" cy="10" r="130" fill="url(#o3)">
      <animate attributeName="cx" values="470;580;470" dur="12s" repeatCount="indefinite"/>
    </circle>
    <g fill="#cdd6f4">
      <circle cx="90" cy="210" r="2" opacity="0.5"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="810" cy="60" r="2.5" opacity="0.5"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="40" r="1.5" opacity="0.5"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="200" cy="238" r="1.5" opacity="0.5"><animate attributeName="opacity" values="0.9;0.1;0.9" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="850" cy="150" r="2" opacity="0.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="5s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <rect x="6" y="6" width="888" height="258" rx="26" fill="none" stroke="url(#border)" stroke-width="1.5" opacity="0.8"/>

  <!-- small label with side lines -->
  <rect x="300" y="43" width="40" height="1.5" fill="#6c7086"/>
  <rect x="560" y="43" width="40" height="1.5" fill="#6c7086"/>
  <text x="450" y="48" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" letter-spacing="6" fill="#a6adc8">PORTFOLIO 2026</text>

  <!-- name: first name light, surname big gradient -->
  <text x="450" y="95" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="300" letter-spacing="14" fill="#cdd6f4">MUHAMMAD</text>
  <text x="450" y="160" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="800" letter-spacing="2" fill="url(#name)">AWAIS AFZAL</text>

  <!-- underline draws in -->
  <rect x="450" y="178" width="0" height="3" rx="1.5" fill="url(#border)">
    <animate attributeName="width" values="0;240;240" keyTimes="0;0.4;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="450;330;330" keyTimes="0;0.4;1" dur="4s" repeatCount="indefinite"/>
  </rect>

  <text x="450" y="212" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="9" fill="#f5c2e7">AI / ML ENGINEER</text>
  <text x="450" y="240" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" letter-spacing="3" fill="#a6adc8">Agents  ·  Computer Vision  ·  Python Backends</text>
</svg>
